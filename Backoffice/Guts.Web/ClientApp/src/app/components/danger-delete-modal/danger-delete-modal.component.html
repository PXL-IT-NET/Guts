@if (show()) {
  <div
    class="modal fade show d-block"
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    style="background-color: rgba(0, 0, 0, 0.5)"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-danger position-relative">
        <app-loading-overlay [show]="loading()"></app-loading-overlay>
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title fw-bold">{{ title() }}</h5>
          <button
            type="button"
            class="btn-close btn-close-white"
            aria-label="Close"
            [disabled]="loading()"
            (click)="onCancel()"
          ></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger mb-3" role="alert">
            {{ warningMessage() }}
          </div>
          <label class="form-label" for="dangerConfirmInput">
            To confirm, type
            <strong><code>{{ expectedConfirmation() }}</code></strong>
            ({{ confirmationLabel() }}):
          </label>
          <input
            id="dangerConfirmInput"
            type="text"
            class="form-control"
            [placeholder]="expectedConfirmation()"
            [disabled]="loading()"
            [ngModel]="confirmationInput()"
            (ngModelChange)="confirmationInput.set($event)"
            data-testid="danger-confirm-input"
          />
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            [disabled]="loading()"
            (click)="onCancel()"
          >
            Cancel
          </button>
          <button
            type="button"
            class="btn btn-danger"
            [disabled]="!canConfirm() || loading()"
            (click)="onConfirm()"
          >
            {{ confirmButtonText() }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
