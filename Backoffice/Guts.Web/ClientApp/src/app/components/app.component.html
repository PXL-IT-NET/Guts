@if (authService.isImpersonating()) {
  <div
    class="alert alert-warning mb-0 rounded-0 d-flex align-items-center justify-content-between px-3 py-2 border-bottom border-warning"
    role="alert"
    data-testid="impersonation-banner"
  >
    <div>
      <strong>Impersonation Mode (Read-Only):</strong>
      @if (authService.impersonatedProfile(); as profile) {
        <span>
          Viewing as <strong>{{ profile.email }}</strong>
          ({{ profile.roles.join(", ") }})
        </span>
      }
      <span class="ms-2 badge text-bg-secondary">Changes disabled</span>
    </div>
    <button
      type="button"
      class="btn btn-sm btn-dark"
      (click)="stopImpersonating()"
    >
      Stop Impersonating
    </button>
  </div>
}
<app-nav-menu></app-nav-menu>
<div class="container-fluid">
  <div class="row">
    <app-sidebar-menu class="col-md-auto"></app-sidebar-menu>
    <main class="col ms-sm-auto p-md-3 pb-md-0">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
