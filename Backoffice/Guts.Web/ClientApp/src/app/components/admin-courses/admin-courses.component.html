<div class="container-fluid py-3 position-relative">
  <app-loading-overlay [show]="loading()"></app-loading-overlay>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Manage Courses</h2>
    <button type="button" class="btn btn-primary" (click)="startCreate()">
      New Course
    </button>
  </div>

  @if (editingCourseId() !== null) {
    <div class="card mb-4">
      <div class="card-header">
        {{ editingCourseId() === 0 ? "Create Course" : "Edit Course" }}
      </div>
      <div class="card-body">
        <form (ngSubmit)="saveCourse()">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label" for="courseCode">Code</label>
              <input
                id="courseCode"
                type="text"
                maxlength="20"
                class="form-control"
                name="code"
                [(ngModel)]="formCode"
                required
              />
            </div>
            <div class="col-md-8">
              <label class="form-label" for="courseName">Name</label>
              <input
                id="courseName"
                type="text"
                class="form-control"
                name="name"
                [(ngModel)]="formName"
                required
              />
            </div>
          </div>
          <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-success">Save</button>
            <button
              type="button"
              class="btn btn-secondary"
              (click)="cancelForm()"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  }

  <app-danger-delete-modal
    [show]="coursePendingDelete() !== null"
    [loading]="loading()"
    title="Danger: Delete Course"
    [warningMessage]="
      'You are about to permanently delete course ' +
      (coursePendingDelete()?.code ?? '') +
      ' - ' +
      (coursePendingDelete()?.name ?? '') +
      '. This is irreversible and will delete all chapters, projects, test results, assessments, and gamification data for this course!'
    "
    [expectedConfirmation]="coursePendingDelete()?.code ?? ''"
    confirmationLabel="course code"
    confirmButtonText="Confirm Delete Course"
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()"
  ></app-danger-delete-modal>

  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th class="text-end">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (course of courses(); track course.id) {
        <tr>
          <td>{{ course.code }}</td>
          <td>{{ course.name }}</td>
          <td class="text-end">
            <button
              type="button"
              class="btn btn-sm btn-outline-primary me-2"
              (click)="startEdit(course)"
            >
              Edit
            </button>
            <button
              type="button"
              class="btn btn-sm btn-outline-danger"
              (click)="requestDelete(course)"
            >
              Delete
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
