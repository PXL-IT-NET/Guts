<header class="navbar navbar-expand-md navbar-dark bg-dark">
  <a
    [routerLink]="['/home']"
    class="navbar-brand col-md-3 col-lg-2 me-0 px-3 fs-6"
  >
    <small>
      <span>Guts</span>
    </small>
  </a>
  <button
    class="navbar-toggler position-absolute d-md-none"
    type="button"
    data-bs-toggle="collapse"
    data-bs-target="#sidebarMenu"
    aria-controls="sidebarMenu"
    aria-expanded="false"
    aria-label="Toggle navigation"
  >
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="w-100">
    <!-- This is a hack to make the following ul align to the right -->

    <ul class="navbar-nav me-auto">
      <li class="nav-item">
        <a
          [routerLink]="['/home']"
          [routerLinkActive]="['active']"
          class="nav-link"
        >
          <span class="oi oi-home"></span> Home
        </a>
      </li>
    </ul>
  </div>
  <ul class="navbar-nav pe-3 ps-3">
    <!-- show period dropdown -->
    @if (allPeriods.length > 0) {
      <li class="nav-item dropdown">
        <button class="nav-link dropdown-toggle show btn btn-link text-decoration-none border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <span class="bi bi-calendar"></span>
          <span> {{ selectedPeriod.description }}</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          @for (period of allPeriods; track period) {
            <li>
              <button type="button" class="dropdown-item" (click)="selectPeriod(period)">
                <span
                  [ngClass]="{
                    'bi-lock': !period.isActive,
                    'bi-unlock': period.isActive,
                  }"
                ></span>
                <span> {{ period.description }}</span>
                <span>
                  ({{ period.from | date: "dd/MM/yyyy" }} -
                  {{ period.until | date: "dd/MM/yyyy" }})</span
                >
              </button>
            </li>
          }
        </ul>
      </li>
    }
    <li class="nav-item dropdown">
      <button class="nav-link dropdown-toggle show btn btn-link text-decoration-none border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <span class="bi bi-person"></span>
        <span> {{ userProfile.email }}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        @if (userProfile.isAuthenticated) {
          <li>
            <a class="dropdown-item" [routerLink]="['/changepassword']">
              <span class="bi bi-key"></span>
              <span> Change password</span>
            </a>
          </li>
          <li>
            <button type="button" class="dropdown-item" (click)="logout()">
              <span class="bi bi-power"></span>
              <span> Afmelden</span>
            </button>
          </li>
        }
        @if (!userProfile.isAuthenticated) {
          <li>
            <a class="dropdown-item" [routerLink]="['/login']">
              <span class="bi bi-box-arrow-in-right"></span>
              <span> Aanmelden</span>
            </a>
          </li>
        }
      </ul>
    </li>
  </ul>
</header>
