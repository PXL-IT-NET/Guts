name: Backoffice Production Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Backoffice/**'
      - '.github/workflows/backoffice-production.yml'
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. CI: Build, Test & Package (Production configuration)
  # =========================================================================
  build-and-test:
    name: Build and Test (CI)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 'Backoffice/Guts.Web/ClientApp/package-lock.json'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Backoffice/Guts.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ---------------------------------------------------------------------
      # Frontend CI: Install dependencies & run tests
      # ---------------------------------------------------------------------
      - name: Install Frontend Dependencies
        working-directory: Backoffice/Guts.Web/ClientApp
        run: npm ci

      - name: Run Frontend Tests (Headless Chrome)
        working-directory: Backoffice/Guts.Web/ClientApp
        run: npm run test:ci -- --reporters dots

      # ---------------------------------------------------------------------
      # Backend CI: Restore, Build & Run Unit/Integration Tests
      # ---------------------------------------------------------------------
      - name: Restore Backend Solution
        run: dotnet restore Backoffice/Guts.slnx

      - name: Build Backend Solution
        run: dotnet build Backoffice/Guts.slnx --no-restore -c Release

      - name: Run Backend Tests
        run: dotnet test Backoffice/Guts.slnx --no-build -c Release --logger "console;verbosity=normal"

      # ---------------------------------------------------------------------
      # Package Artifacts (Production configuration)
      # ---------------------------------------------------------------------
      - name: Publish Guts.Api
        run: >
          dotnet publish Backoffice/Guts.Api/Guts.Api.csproj
          -c Release
          -o publish/api

      - name: Publish Guts.Web (Production configuration)
        run: >
          dotnet publish Backoffice/Guts.Web/Guts.Web.csproj
          -c Release
          -p:AngularConfiguration=production
          -o publish/web

      - name: Upload Guts.Api Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guts-api-production
          path: publish/api/
          retention-days: 14

      - name: Upload Guts.Web Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guts-web-production
          path: publish/web/
          retention-days: 14

      - name: Upload Deployment Scripts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-scripts
          path: Backoffice/deploy/
          retention-days: 14

  # =========================================================================
  # 2. CD: Deploy to Production IIS (Requires Manual Approval via Environment)
  # =========================================================================
  deploy-production:
    name: Deploy to Production (IIS)
    needs: build-and-test
    runs-on: [self-hosted, Windows]
    environment:
      name: production
      url: https://guts-web.pxl.be/

    steps:
      - name: Download Deployment Scripts
        uses: actions/download-artifact@v4
        with:
          name: deploy-scripts
          path: deploy

      - name: Download Guts.Api Artifact
        uses: actions/download-artifact@v4
        with:
          name: guts-api-production
          path: artifacts/api

      - name: Download Guts.Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: guts-web-production
          path: artifacts/web

      - name: Deploy Guts.Api to IIS Production
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\deploy\deploy-to-iis.ps1" `
            -AppType "Api" `
            -SourcePath "$env:GITHUB_WORKSPACE\artifacts\api" `
            -DestinationPath "C:\Guts\Guts-Api" `
            -AppPoolName "ApiCorePool" `
            -EnvironmentName "Production"

      - name: Deploy Guts.Web to IIS Production
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\deploy\deploy-to-iis.ps1" `
            -AppType "Web" `
            -SourcePath "$env:GITHUB_WORKSPACE\artifacts\web" `
            -DestinationPath "C:\Guts\Guts-Web" `
            -AppPoolName "WebCorePool" `
            -EnvironmentName "Production"

      - name: Verify Production Health (Smoke Test)
        shell: powershell
        run: |
          Write-Host "Verifying Production endpoints..."
          $endpoints = @(
            @{ Name = "Web Production"; Url = "https://guts-web.pxl.be/" },
            @{ Name = "API Production Swagger"; Url = "https://guts-api.pxl.be/swagger/index.html" }
          )

          foreach ($ep in $endpoints) {
            try {
              Write-Host "Probing $($ep.Name) at $($ep.Url)..."
              $resp = Invoke-WebRequest -Uri $ep.Url -UseBasicParsing -TimeoutSec 15
              Write-Host "  -> $($ep.Name) responded with HTTP $($resp.StatusCode)"
            } catch {
              Write-Warning "  -> $($ep.Name) probe warning: $_"
            }
          }

