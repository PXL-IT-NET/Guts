name: Backoffice Staging Release

on:
  push:
    branches:
      - develop
    paths:
      - "Backoffice/**"
      - ".github/workflows/backoffice-staging.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "Backoffice/**"
      - ".github/workflows/backoffice-staging.yml"
  workflow_dispatch:
    inputs:
      deploy_to_staging:
        description: "Deploy to Staging after CI build and tests succeed"
        required: true
        type: boolean
        default: true

jobs:
  # =========================================================================
  # 1. CI: Build, Test, SonarCloud Analysis & Package
  # =========================================================================
  build-and-test:
    name: Build, Test and Analyze (CI)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Disable shallow clone so SonarCloud can compute git blame and new code metrics

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: "Backoffice/Guts.Web/ClientApp/package-lock.json"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Backoffice/Guts.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # ---------------------------------------------------------------------
      # Frontend CI: Install dependencies & run tests with coverage
      # ---------------------------------------------------------------------
      - name: Install Frontend Dependencies
        working-directory: Backoffice/Guts.Web/ClientApp
        run: npm ci

      - name: Run Frontend Tests (Headless Chrome with Coverage)
        working-directory: Backoffice/Guts.Web/ClientApp
        run: npm run test:ci -- --code-coverage --reporters dots

      - name: Normalize Frontend LCOV Paths for Sonar
        shell: powershell
        working-directory: Backoffice/Guts.Web/ClientApp
        run: |
          $lcovPath = "coverage/ClientApp/lcov.info"
          if (Test-Path $lcovPath) {
            $clientAppDir = (Get-Item .).FullName
            $lines = Get-Content $lcovPath | ForEach-Object {
              if ($_ -match '^SF:(.*)') {
                $sf = $matches[1]
                if (-not [System.IO.Path]::IsPathRooted($sf)) {
                  $sf = Join-Path $clientAppDir $sf
                }
                "SF:$sf"
              } else {
                $_
              }
            }
            Set-Content -Path $lcovPath -Value $lines -Encoding UTF8
          }

      # ---------------------------------------------------------------------
      # Backend CI: Restore, SonarCloud Begin, Build & Run Tests with Coverage
      # ---------------------------------------------------------------------
      - name: Restore .NET Tools
        working-directory: Backoffice
        run: dotnet tool restore

      - name: Restore Backend Solution
        run: dotnet restore Backoffice/Guts.slnx

      - name: SonarCloud Begin Analysis
        shell: powershell
        working-directory: Backoffice
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $openCoverPaths = Join-Path $PWD "TestResults\**\coverage.opencover.xml"
          $trxPaths = Join-Path $PWD "TestResults\*.trx"
          $lcovPath = Join-Path $PWD "Guts.Web\ClientApp\coverage\ClientApp\lcov.info"
          $exclusions = @(
            "**/Migrations/**",
            "**/node_modules/**",
            "**/dist/**",
            "**/coverage/**",
            "**/TestResults/**",
            "**/*.spec.ts",
            "**/Guts.Web/ClientApp/src/environments/**",
            "**/Guts.Web/ClientApp/karma.conf.js",
            "**/Guts.Web/ClientApp/proxy.conf.js",
            "**/Guts.Web/ClientApp/aspnetcore-https.js"
          ) -join ","

          dotnet tool run dotnet-sonarscanner begin `
            /k:"PXL-IT-NET_Guts" `
            /o:"pxl-it-net" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.cs.opencover.reportsPaths="$openCoverPaths" `
            /d:sonar.cs.vstest.reportsPaths="$trxPaths" `
            /d:sonar.javascript.lcov.reportPaths="$lcovPath" `
            /d:sonar.exclusions="$exclusions" `
            /d:sonar.coverage.exclusions="**/Guts.Bootstrapper/**" `
            /d:sonar.test.inclusions="**/*.spec.ts" `
            /d:sonar.qualitygate.wait=true

      - name: Build Backend Solution
        run: dotnet build Backoffice/Guts.slnx --no-restore -c Release --no-incremental

      - name: Run Backend Tests with Coverage
        run: >
          dotnet test Backoffice/Guts.slnx
          --no-build
          -c Release
          --logger "console;verbosity=normal"
          --logger "trx"
          --results-directory Backoffice/TestResults
          --collect:"XPlat Code Coverage"
          --settings Backoffice/coverlet.runsettings

      - name: SonarCloud End Analysis & Quality Gate
        shell: powershell
        working-directory: Backoffice
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool run dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      # ---------------------------------------------------------------------
      # Package Artifacts (Staging configuration)
      # ---------------------------------------------------------------------
      - name: Publish Guts.Api
        run: >
          dotnet publish Backoffice/Guts.Api/Guts.Api.csproj
          -c Release
          -o publish/api

      - name: Publish Guts.Web (Staging configuration)
        run: >
          dotnet publish Backoffice/Guts.Web/Guts.Web.csproj
          -c Release
          -p:AngularConfiguration=staging
          -o publish/web

      - name: Upload Guts.Api Staging Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guts-api-staging
          path: publish/api/
          retention-days: 7

      - name: Upload Guts.Web Staging Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guts-web-staging
          path: publish/web/
          retention-days: 7

      - name: Upload Deployment Scripts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-scripts
          path: Backoffice/deploy/
          retention-days: 7

  # =========================================================================
  # 2. CD: Deploy to Staging IIS (Runs on Self-Hosted Runner behind Firewall)
  # =========================================================================
  deploy-staging:
    name: Deploy to Staging (IIS)
    needs: build-and-test
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_to_staging == true)
    runs-on: [self-hosted, Windows]

    steps:
      - name: Download Deployment Scripts
        uses: actions/download-artifact@v4
        with:
          name: deploy-scripts
          path: deploy

      - name: Download Guts.Api Artifact
        uses: actions/download-artifact@v4
        with:
          name: guts-api-staging
          path: artifacts/api

      - name: Download Guts.Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: guts-web-staging
          path: artifacts/web

      - name: Deploy Guts.Api to IIS Staging
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\deploy\deploy-to-iis.ps1" `
            -AppType "Api" `
            -SourcePath "$env:GITHUB_WORKSPACE\artifacts\api" `
            -DestinationPath "C:\Guts_Staging\Guts-Api" `
            -AppPoolName "StagingApiPool" `
            -EnvironmentName "Staging"

      - name: Deploy Guts.Web to IIS Staging
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\deploy\deploy-to-iis.ps1" `
            -AppType "Web" `
            -SourcePath "$env:GITHUB_WORKSPACE\artifacts\web" `
            -DestinationPath "C:\Guts_Staging\Guts-Web" `
            -AppPoolName "StagingWebPool" `
            -EnvironmentName "Staging"

      - name: Verify Staging Health (Smoke Test)
        shell: powershell
        run: |
          Write-Host "Verifying Staging endpoints..."
          $endpoints = @(
            @{ Name = "Web Staging"; Url = "https://guts-web.pxl.be/staging/" },
            @{ Name = "API Staging Swagger"; Url = "https://guts-api.pxl.be/staging/swagger/index.html" }
          )

          foreach ($ep in $endpoints) {
            try {
              Write-Host "Probing $($ep.Name) at $($ep.Url)..."
              $resp = Invoke-WebRequest -Uri $ep.Url -UseBasicParsing -TimeoutSec 15
              Write-Host "  -> $($ep.Name) responded with HTTP $($resp.StatusCode)"
            } catch {
              Write-Warning "  -> $($ep.Name) probe warning: $_"
            }
          }
